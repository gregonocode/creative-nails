<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6b45" />
    <title>Sem conexão | Duts Receitas</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff9f5;
        color: #2d211d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 36px 26px;
        border: 1px solid #ffdfd4;
        border-radius: 30px;
        background: #fff;
        text-align: center;
        box-shadow: 0 24px 70px rgba(82, 45, 32, .12);
      }
      .icon {
        width: 76px;
        height: 76px;
        margin: 0 auto;
        border-radius: 24px;
        box-shadow: 0 14px 35px rgba(255, 107, 69, .25);
      }
      h1 { margin: 24px 0 0; font-size: 30px; line-height: 1; letter-spacing: -.04em; }
      p { margin: 14px auto 0; max-width: 320px; color: #74645e; font-size: 15px; line-height: 1.6; }
      a {
        min-height: 52px;
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 24px;
        background: #ff6b45;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icon/icon-192.png" alt="" width="76" height="76" />
      <h1>Você está sem conexão</h1>
      <p>As receitas que você já abriu continuam disponíveis. Reconecte-se para carregar conteúdos novos.</p>
      <a href="/dezreceitas">TENTAR NOVAMENTE</a>
    </main>
  </body>
</html>
